site_name: idftool
site_description: The ultimate CLI tool for interacting with Espressif devices
site_url: https://nebkat.github.io/idftool/
repo_url: https://github.com/nebkat/idftool
repo_name: nebkat/idftool
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/chip
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

nav:
  - Home:
      - idftool: index.md
      - Installation: installation.md
      - Guide:
          - Getting started: guide/getting-started.md
          - Choosing a device: guide/choosing-a-device.md
          - Flashing firmware: guide/flashing-firmware.md
          - Monitoring a device: guide/monitoring.md
          - Provisioning devices: guide/provisioning.md
          - Backups and releases: guide/backups-and-releases.md
      - Advanced:
          - Partition addressing: guide/partition-addressing.md
          - Partitions or files: guide/partitions-or-files.md
          - Scripting: guide/scripting.md
          - Python library: library.md
          - Plugins: guide/plugins.md
  - Reference:
      - Overview: reference/index.md
      - Commands:
          - Discovery: reference/discovery.md
          - Firmware: reference/firmware.md
          - Monitor: reference/monitor.md
          - idf.py: reference/idf-py.md
          - Partition I/O: reference/partition-io.md
          - Images: reference/images.md
          - Bundles: reference/bundles.md
          - Partition table: reference/partition-table.md
          - NVS: reference/nvs.md
          - Filesystems: reference/filesystems.md
          - Misc: reference/misc.md
      - Options:
          - Global options: reference/global-options.md
          - Write options: reference/write-options.md
  - Changelog: changelog.md
  - Contributing: contributing.md

extra:
  version:
    provider: mike
    default: latest

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
