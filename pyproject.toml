[build-system]
    requires = ["setuptools>=64", "setuptools-scm"]
    build-backend = "setuptools.build_meta"

[project]
    name = "idftool"
    description = "The ultimate CLI tool for interacting with Espressif devices"
    readme = "README.md"
    license = "Apache-2.0"
    requires-python = ">=3.10"
    dynamic = ["version"]
    dependencies = [
        "click>=8.1",
        "rich-click>=1.9",
        "questionary>=2.0",
        # Ranges, not `~=x.y.z`: each floor is the oldest release with the API idftool
        # uses, and the code targets the latest. esptool 5.4 moved its logger onto
        # esp-pylib, which idftool quiets during writes.
        "esptool>=5.4,<6",
        "esp-idf-defs~=0.1.5",
        # Serial port discovery and sorting, shared with esptool (which moved this
        # code out to esp-pylib). Floor is 1.1.4 rather than 1.0: the sort key
        # changed shape in 1.1.4, and the picker relies on its ordering.
        "esp-pylib>=1.1.4,<2",
        "esp-idf-nvs-partition-gen>=0.1.9,<0.4",
        # XTS-AES for encrypted NVS; 3.1 made the backend argument optional.
        "cryptography>=3.1",
        "esp-idf-monitor>=1.4,<2",
        # Filesystem images. pyfatfs is used through its low-level PyFat API only, so its
        # PyFilesystem2 dependency is never imported; littlefs-python is what esp_littlefs
        # itself generates images with. SPIFFS needs no dependency — ESP-IDF's generator is
        # vendored in idftool/fs/spiffsgen.py.
        "pyfatfs~=1.1",
        "littlefs-python~=0.19",
    ]

[project.optional-dependencies]
    test = ["pytest>=8", "pytest-cov>=7", "coverage>=7.10"]
    # MkDocs 2.0 drops the plugin and theme system Material is built on.
    docs = ["mkdocs>=1.6,<2", "mkdocs-material~=9.7", "mike>=2"]

[project.scripts]
    idftool = "idftool.__main__:_main"

[project.urls]
    Source = "https://github.com/nebkat/idftool"

[tool.setuptools]
    packages = ["idftool", "idftool.commands", "idftool.fs", "idftool.nvs"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
    testpaths = ["test"]
    markers = [
        "device: requires a real ESP connected via --port (skipped otherwise)",
        "slow: slow device test (reads or writes every partition)",
    ]

[tool.coverage.run]
    source = ["idftool"]
    # The CLI tests run `python -m idftool` in a subprocess.
    patch = ["subprocess"]
    parallel = true
