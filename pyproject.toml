[build-system]
    requires = ["setuptools>=64", "setuptools-scm"]
    build-backend = "setuptools.build_meta"

[project]
    name = "idftool"
    description = "Utility for flashing, provisioning, and interacting with Espressif SOCs running ESP-IDF"
    readme = "README.md"
    license = "Apache-2.0"
    requires-python = ">=3.10"
    dynamic = ["version"]
    dependencies = [
        "click>=8.1",
        "rich-click>=1.9",
        "questionary>=2.0",
        # Ranges, not `~=x.y.z`: idftool is installed into the ESP-IDF Python env, which
        # pins these itself — IDF 6.0 and 6.1 both ship esptool 5.3.1 and
        # nvs-partition-gen 0.1.9, and a compatible-release pin loses to it on every
        # bump. Only the API idftool actually uses has to hold: esptool's CHIP_DEFS /
        # ESPLoader / flash_size_bytes and cmds.{detect_chip,detect_flash_size,
        # read_flash,write_flash,erase_region,merge_bin}, and nvs_partition_gen's
        # generate(args) plus its NVS and Page classes.
        "esptool>=5.2,<6",
        "esp-idf-defs~=0.1.5",
        # Serial port discovery and sorting, shared with esptool (which moved this
        # code out to esp-pylib). Floor is 1.1.4 rather than 1.0: the sort key
        # changed shape in 1.1.4, and the picker relies on its ordering.
        "esp-pylib>=1.1.4,<2",
        "esp-idf-nvs-partition-gen>=0.1.9,<0.3",
        # Filesystem images. pyfatfs is used through its low-level PyFat API only, so its
        # PyFilesystem2 dependency is never imported; littlefs-python is what esp_littlefs
        # itself generates images with. SPIFFS needs no dependency — ESP-IDF's generator is
        # vendored in idftool/fs/spiffsgen.py.
        "pyfatfs~=1.1",
        "littlefs-python~=0.19",
    ]

[project.optional-dependencies]
    test = ["pytest>=8"]

[project.scripts]
    idftool = "idftool.__main__:_main"

[project.urls]
    Source = "https://github.com/nebkat/idftool"

[tool.setuptools]
    packages = ["idftool", "idftool.commands", "idftool.fs", "idftool.nvs"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
    testpaths = ["test"]
    markers = [
        "device: requires a real ESP connected via --port (skipped otherwise)",
        "slow: slow device test (reads or writes every partition)",
    ]
