name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[test]"

      - name: Test
        run: pytest --cov --cov-report=lcov

      - name: Upload coverage to Coveralls
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov

  typecheck:
    name: typecheck (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[typing]"

      - name: mypy --strict
        run: mypy

  package:
    name: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Check py.typed is shipped
        run: |
          unzip -l dist/*.whl | grep -q 'idftool/py.typed'
          tar -tzf dist/*.tar.gz | grep -q 'idftool/py.typed'
